/* ==================================================
   GAME VARIABLES
================================================== */

let currentLevel = "";
let currentQuestion = 0;
let score = 0;
let selectedQuestions = [];


/* ==================================================
   SCREEN CONTROL
================================================== */

function showScreen(id){

    document.querySelectorAll(".screen").forEach(function(screen){

        screen.classList.remove("active");

    });

    document.getElementById(id).classList.add("active");

}


/* ==================================================
   EXACT 50 SECOND COUNTDOWN
================================================== */

function startAdvertisement(){

    let timerNumber = 50;

    const timerElement =
        document.getElementById("timer");

    timerElement.textContent =
        "50 seconds";


    const countdown =
        setInterval(function(){

            timerNumber--;

            timerElement.textContent =
                timerNumber + " seconds";


            if(timerNumber <= 0){

                clearInterval(countdown);

                document.getElementById("adScreen")
                    .classList.remove("active");

                document.getElementById("levelScreen")
                    .classList.add("active");

            }

        },1000);

}


/* ==================================================
   START GAME
================================================== */

function startGame(level){

    currentLevel = level;

    currentQuestion = 0;

    score = 0;

    selectedQuestions = questions[level];

    showScreen("quizScreen");

    showQuestion();

}


/* ==================================================
   SHOW QUESTION
================================================== */

function showQuestion(){

    const q =
        selectedQuestions[currentQuestion];


    document.getElementById("progress").textContent =
        "Question " +
        (currentQuestion + 1) +
        " / 50";


    document.getElementById("question").textContent =
        q[0];


    const optionsBox =
        document.getElementById("options");


    optionsBox.innerHTML = "";


    document.getElementById("nextButton").style.display =
        "none";


    for(let i = 1; i <= 4; i++){

        const button =
            document.createElement("button");


        button.className =
            "option";


        button.textContent =
            String.fromCharCode(64 + i) +
            ". " +
            q[i];


        button.onclick =
            function(){

                checkAnswer(button,q[i]);

            };


        optionsBox.appendChild(button);

    }

}


/* ==================================================
   CHECK ANSWER
================================================== */

function checkAnswer(button,answer){

    const correct =
        correctAnswers[currentLevel][currentQuestion];


    const buttons =
        document.querySelectorAll(".option");


    buttons.forEach(function(btn){

        btn.disabled = true;

    });


    if(answer === correct){

        button.classList.add("correct");

        score++;

    }

    else{

        button.classList.add("wrong");


        buttons.forEach(function(btn){

            if(btn.textContent.substring(3) === correct){

                btn.classList.add("correct");

            }

        });

    }


    document.getElementById("nextButton").style.display =
        "inline-block";

}


/* ==================================================
   NEXT QUESTION
================================================== */

function nextQuestion(){

    currentQuestion++;


    if(currentQuestion >= 50){

        finishGame();

    }

    else{

        showQuestion();

    }

}


/* ==================================================
   FINISH GAME
================================================== */

function finishGame(){

    showScreen("resultScreen");


    document.getElementById("score").textContent =
        "Your Score: " +
        score +
        " / 50";

}

    showScreen("answerScreen");


    const list =
        document.getElementById("answerList");


    list.innerHTML = "";


    for(let i = 0; i < 50; i++){

        const item =
            document.createElement("div");


        item.className =
            "answer-item";


        item.innerHTML =
            "<b>Q" +
            (i + 1) +
            ":</b> " +
            selectedQuestions[i][0] +
            "<br><b>Answer:</b> " +
            correctAnswers[currentLevel][i];


        list.appendChild(item);

    }

}
